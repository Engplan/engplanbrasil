<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engplan Brasil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="logo">ENGPLAN <span>BRASIL</span></div>
        <nav>
            <a href="#">Início</a>
            <a href="#">Serviços</a>
            <a href="#">Obras</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <section class="hero">

        <!-- Camadas do fundo -->
        <div class="bg-wrapper">
            <img src="images/bg-layer-1.jpg" class="bg layer1">
            <img src="images/bg-layer-2.png" class="bg layer2">
            <img src="images/bg-layer-3.png" class="bg layer3">
            <img src="images/bg-layer-4.png" class="bg layer4">
            <img src="images/personagem.png" class="bg personagem">
        </div>

        <div class="hero-content">
            <h1>SOLUÇÕES<br>DE ENGENHARIA</h1>
            <p>Projetos, obras, regularizações e serviços técnicos<br>com qualidade e precisão.</p>

            <div class="hero-buttons">
                <a href="#" class="btn btn-whats">Falar no WhatsApp</a>
                <a href="#" class="btn btn-cta">Solicitar Orçamento</a>
            </div>
        </div>
    </section>

</body>
</html>
