<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel do Cliente - ENGPLAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section class="painel-container">
    <h2>Olá, <span id="nomeCliente">Cliente</span>!</h2>

    <!-- Botão para tirar foto -->
    <label for="fileInput" style="cursor:pointer; color:blue; text-decoration:underline;">
      Tirar foto da obra
    </label>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" />

    <p id="statusUpload"></p>

    <!-- Imagem preview da foto -->
    <img id="previewImagem" alt="Preview da foto" style="max-width: 100%; margin-top: 10px; display:none;" />

    <a href="login.html" class="btn-sair">Sair</a>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

    // Configuração Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCmpv_QRPrChh44M4nncycjD9UirgcnXoA",
      authDomain: "engplan2025.firebaseapp.com",
      projectId: "engplan2025",
      storageBucket: "engplan2025.appspot.com",
      messagingSenderId: "483035204189",
      appId: "1:483035204189:web:7c2228c5836426ec65dbb4",
      measurementId: "G-BXLF2NY7XT"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const fileInput = document.getElementById('fileInput');
    const statusUpload = document.getElementById('statusUpload');
    const previewImagem = document.getElementById('previewImagem');

    // Endpoint da sua planilha SheetDB
    const sheetDBEndpoint = 'https://sheetdb.io/api/v1/trovsa4pykn7a';

    // Exemplo: definindo código da obra no localStorage (você pode setar isso no login)
    if (!localStorage.getItem('codigoObra')) {
      localStorage.setItem('codigoObra', 'OBRA123'); // substitua por código real dinâmico
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      previewImagem.src = URL.createObjectURL(file);
      previewImagem.style.display = 'block';

      statusUpload.textContent = 'Enviando foto...';

      try {
        const nomeArquivo = `fotos_obra/${Date.now()}_${file.name}`;
        const storageRef = ref(storage, nomeArquivo);

        await uploadBytes(storageRef, file);
        const urlFoto = await getDownloadURL(storageRef);

        statusUpload.textContent = 'Foto enviada com sucesso!';

        const codigoObra = localStorage.getItem('codigoObra') || 'sem_codigo';

        const dataToSend = {
          data: {
            codigo_obra: codigoObra,
            url_foto: urlFoto,
            data_envio: new Date().toISOString()
          }
        };

        const response = await fetch(sheetDBEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToSend)
        });

        if (response.ok) {
          console.log('URL da foto salvo na planilha');
        } else {
          console.error('Erro ao salvar na planilha', await response.text());
          statusUpload.textContent = 'Foto enviada, mas falha ao salvar na planilha.';
        }

      } catch (error) {
        console.error('Erro ao enviar foto:', error);
        statusUpload.textContent = 'Erro ao enviar a foto. Tente novamente.';
      }
    });
  </script>
</body>
</html>
