<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel da Obra - ENGPLAN BRASIL</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #ff8800;
    }
    .progress-bar {
      width: 100%;
      background-color: #ddd;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .progress {
      height: 24px;
      background-color: #ffa500;
      text-align: center;
      color: white;
      border-radius: 5px;
      transition: width 0.5s ease;
    }
    img {
      max-width: 100%;
      margin: 10px 0;
      border-radius: 6px;
    }
    a {
      color: #0066cc;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Olá, <span id="nomeCliente">Cliente</span></h2>

    <div class="progress-bar">
      <div id="progressoObra" class="progress" style="width: 0%">0%</div>
    </div>

    <p><strong>Mensagem da Engplan:</strong></p>
    <p id="mensagem">Carregando mensagem...</p>

    <div id="imagensObra">
      <img id="imagem1" src="" alt="Imagem da obra 1" />
      <img id="imagem2" src="" alt="Imagem da obra 2" />
    </div>

    <p>
      📄 <a id="linkContrato" href="#" target="_blank">Clique aqui para visualizar seu contrato</a>
    </p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cpf = urlParams.get('cpf') || urlParams.get('codigo');
    const apiUrl = "https://sheetdb.io/api/v1/trovsa4pykn7a/search?cpf=" + cpf;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        if (data.length === 0) {
          alert("CPF ou código não encontrado.");
          window.location.href = "login.html";
          return;
        }

        const dados = data[0];
        document.getElementById('nomeCliente').textContent = dados.nome || "Cliente";

        // Progresso
        const progresso = dados.progresso || "0%";
        const progressoBarra = document.getElementById('progressoObra');
        progressoBarra.style.width = progresso;
        progressoBarra.textContent = progresso;

        // Mensagem
        document.getElementById('mensagem').textContent = dados.mensagem || "";

        // Imagens
