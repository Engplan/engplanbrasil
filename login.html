<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - ENGPLAN BRASIL</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <section class="login-container">
    <h2>Acesso à Obra</h2>
    <form id="loginForm">
      <label for="codigo">CPF ou Código da Obra:</label>
      <input type="text" id="codigo" name="codigo" required placeholder="Digite seu CPF ou Código" />
      <button type="submit">Entrar</button>
    </form>
  </section>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const codigo = document.getElementById('codigo').value.trim();
      if (codigo) {
        window.location.href = 'painel.html';
      } else {
        alert('Por favor, insira seu CPF ou Código da Obra.');
      }
    });
  </script>
</body>
</html>
