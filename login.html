<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - ENGPLAN BRASIL</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <section class="login-container">
    <h2>Acompanhe sua Obra</h2>
    <form id="loginForm">
      <input type="text" id="cpfOuCodigo" placeholder="Digite seu CPF ou Código da Obra" required />
      <button type="submit">Entrar</button>
    </form>
    <p id="erro" style="color:red; display:none;">CPF ou Código não encontrado.</p>
  </section>

  <script>
    const form = document.getElementById('loginForm');
    const erro = document.getElementById('erro');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('cpfOuCodigo').value.trim();

      try {
        const res = await fetch(`https://sheetdb.io/api/v1/trovsa4pykn7a/search_or?cpf=${input}&codigo=${input}`);
        const data = await res.json();

        if (data.length > 0) {
          localStorage.setItem('dadosCliente', JSON.stringify(data[0]));
          window.location.href = 'painel.html';
        } else {
          erro.style.display = 'block';
        }
      } catch (error) {
        console.error('Erro na autenticação:', error);
        erro.style.display = 'block';
      }
    });
  </script>
</body>
</html>
